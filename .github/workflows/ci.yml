name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks lists the commits of a pull request to scan exactly those; read is enough.
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
          DIRECT_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
      - run: npm run typecheck
      - run: npm run lint
      # Fails on high/critical advisories except the reviewed ones in audit-ci.jsonc.
      - run: npx --yes audit-ci@^7 --config audit-ci.jsonc
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job has read-only permissions, so do not try to post PR comments.
          GITLEAKS_ENABLE_COMMENTS: "false"
